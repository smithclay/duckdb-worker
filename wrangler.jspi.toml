# DuckDB reading http(s) files with fetch() range requests via JSPI (src/jspi.rs, src/jspi_fs.cpp).
#
# Needs an unreleased toolchain (see README "JSPI range reads"): export
#   EMSCRIPTEN=<emscripten checkout of PR #27699>   EMSDK=<emsdk 6.0.10 with binaryen PR #9102>
#   DUCKDB_SRC=<duckdb checkout matching tiny/build.sh>
name = "duckdb-tiny-jspi"
main = "src/entry.js"
compatibility_date = "2026-09-02"
compatibility_flags = ["new_module_registry"]

[build]
command = "RUSTFLAGS=--cfg=wasm_bindgen_unstable_jspi worker-build --emscripten --release -d build-jspi . --features jspi"

